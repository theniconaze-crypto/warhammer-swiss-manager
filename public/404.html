<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Warhammer Tournaments</title>
    <script type="text/javascript">
      // Redirection Single Page App pour GitHub Pages
      // Redirige l'URL actuelle vers index.html en encodant le chemin
      var pathSegmentsToKeep = 1; // Garde '/warhammer-swiss-manager/'
      var l = window.location;
      var redirect = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      window.location.replace(redirect);
    </script>
  </head>
  <body>
</body>
</html>
